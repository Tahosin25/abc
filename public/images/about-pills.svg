<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="medBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#medBg)" rx="16" />

  <!-- Stethoscope curved tubing -->
  <path d="M120 80 C120 280 420 320 480 180" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" />
  <path d="M480 180 C500 130 520 100 550 90" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" />
  <!-- Chestpiece / Bell -->
  <g transform="translate(110, 70)">
    <circle cx="10" cy="10" r="32" fill="url(#metalGrad)" stroke="#475569" stroke-width="2" />
    <circle cx="10" cy="10" r="22" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Assorted medicine pills and capsules in foreground -->
  <!-- Blue/white capsule -->
  <g transform="translate(380, 260) rotate(25)">
    <rect x="0" y="0" width="70" height="34" rx="17" fill="#0284c7" />
    <rect x="35" y="0" width="35" height="34" rx="17" fill="#ffffff" />
    <line x1="35" y1="0" x2="35" y2="34" stroke="#94a3b8" stroke-width="1.5" />
  </g>

  <!-- White round scored tablet -->
  <g transform="translate(320, 240)">
    <ellipse cx="30" cy="30" rx="30" ry="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <line x1="10" y1="30" x2="50" y2="30" stroke="#cbd5e1" stroke-width="2" />
  </g>

  <!-- Yellow round tablet -->
  <g transform="translate(260, 270)">
    <ellipse cx="25" cy="25" rx="25" ry="20" fill="#fef08a" stroke="#fde047" stroke-width="2" />
  </g>

  <!-- Small white pill stack -->
  <g transform="translate(350, 200)">
    <ellipse cx="20" cy="24" rx="22" ry="14" fill="#e2e8f0" />
    <ellipse cx="20" cy="18" rx="22" ry="14" fill="#f1f5f9" />
    <ellipse cx="20" cy="12" rx="22" ry="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  </g>
</svg>
