<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 480" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>
  <!-- Bright outdoor sunny background -->
  <rect width="650" height="480" fill="url(#skyGrad)" rx="16" />
  <!-- Gentle rolling sunny green hills -->
  <path d="M0 340 C150 300 350 380 650 320 L650 480 L0 480 Z" fill="url(#grassGrad)" />
  <circle cx="550" cy="90" r="45" fill="#fef08a" opacity="0.85" />

  <!-- Father carrying joyful daughter on shoulders, mother smiling beside them -->
  <!-- Father -->
  <g transform="translate(180, 160)">
    <!-- Father torso -->
    <path d="M40 180 L140 180 L130 320 L50 320 Z" fill="#0284c7" />
    <!-- Father neck & head -->
    <rect x="75" y="140" width="30" height="40" fill="#fed7aa" />
    <circle cx="90" cy="110" r="32" fill="#fed7aa" />
    <!-- Dark hair & beard -->
    <path d="M60 100 C60 70 120 70 120 100 L120 115 C115 135 105 145 90 145 C75 145 65 135 60 115 Z" fill="#1e293b" />
    <circle cx="90" cy="105" r="24" fill="#fed7aa" />
    <!-- Happy smiling eyes -->
    <path d="M80 105 Q85 100 90 105" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M96 105 Q101 100 106 105" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <!-- Smile -->
    <path d="M83 118 Q93 128 103 118" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <!-- Teeth -->
    <path d="M86 118 Q93 124 100 118" fill="#ffffff" />

    <!-- Daughter riding on father's shoulders with arms wide open -->
    <g transform="translate(25, -120)">
      <!-- Daughter arms outstretched flying like an airplane -->
      <path d="M-40 60 Q20 30 55 50" stroke="#fbcfe8" stroke-width="14" stroke-linecap="round" fill="none" />
      <path d="M150 60 Q90 30 55 50" stroke="#fbcfe8" stroke-width="14" stroke-linecap="round" fill="none" />
      <!-- Dress -->
      <polygon points="40,50 70,50 85,110 25,110" fill="#f43f5e" />
      <!-- Head -->
      <circle cx="55" cy="25" r="24" fill="#fed7aa" />
      <!-- Ponytail hair -->
      <path d="M35 25 C35 5 75 5 75 25 C75 35 70 45 55 45 C40 45 35 35 35 25 Z" fill="#78350f" />
      <circle cx="28" cy="15" r="8" fill="#78350f" />
      <!-- Face -->
      <circle cx="55" cy="27" r="18" fill="#fed7aa" />
      <!-- Cheerful expression -->
      <circle cx="50" cy="25" r="2.5" fill="#0f172a" />
      <circle cx="62" cy="25" r="2.5" fill="#0f172a" />
      <path d="M50 33 Q56 41 62 33" stroke="#e11d48" stroke-width="2.5" fill="#ffffff" />
    </g>
  </g>

  <!-- Mother holding father's arm with glowing smile -->
  <g transform="translate(290, 190)">
    <path d="M30 150 L110 150 L100 290 L40 290 Z" fill="#fb7185" />
    <circle cx="70" cy="100" r="28" fill="#fed7aa" />
    <path d="M45 95 C45 65 95 65 95 95 C95 140 85 160 85 160 C70 160 45 130 45 95 Z" fill="#451a03" />
    <circle cx="70" cy="98" r="22" fill="#fed7aa" />
    <!-- Mother smiling face -->
    <circle cx="65" cy="95" r="2.5" fill="#0f172a" />
    <circle cx="78" cy="95" r="2.5" fill="#0f172a" />
    <path d="M66 106 Q73 114 80 106" stroke="#be123c" stroke-width="2.5" fill="#ffffff" />
  </g>
</svg>
