<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 800" width="100%" height="100%">
  <defs>
    <linearGradient id="labBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="maskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="gloveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="heroShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Ambient Laboratory Background with blur and clean circles -->
  <rect width="700" height="800" fill="url(#labBg)" />
  <circle cx="580" cy="180" r="140" fill="#38bdf8" opacity="0.15" />
  <circle cx="120" cy="650" r="200" fill="#0284c7" opacity="0.1" />

  <!-- Microscope Silhouette in Background -->
  <g transform="translate(520, 200)" opacity="0.4" stroke="#0f172a" fill="#0f172a" stroke-width="4">
    <rect x="30" y="220" width="120" height="30" rx="8" />
    <path d="M90 220 L90 80 L60 50" fill="none" stroke-width="18" stroke-linecap="round" />
    <rect x="25" y="10" width="35" height="70" rx="6" />
    <circle cx="42" cy="7" r="15" />
    <rect x="15" y="140" width="70" height="15" rx="4" />
  </g>

  <!-- High-end Pharmaceutical Scientist Figure -->
  <g transform="translate(100, 70)" filter="url(#heroShadow)">
    <!-- Scientist Hair -->
    <path d="M180 180 C180 80 340 70 340 180 C340 240 330 260 330 290 L190 290 C190 260 180 230 180 180 Z" fill="#334155" />

    <!-- Head / Neck -->
    <rect x="235" y="240" width="50" height="80" fill="#fed7aa" rx="10" />

    <!-- Lab Coat Shoulders & Chest -->
    <path d="M120 320 C140 290 200 280 260 280 C320 280 380 290 400 320 L450 680 C450 710 430 730 400 730 L120 730 C90 730 70 710 70 680 Z" fill="url(#coatGrad)" />
    <!-- Lab Coat Collar & Stethoscope -->
    <polygon points="260,290 220,380 260,490 300,380" fill="#e2e8f0" />
    <polygon points="210,300 245,390 190,480" fill="#ffffff" />
    <polygon points="310,300 275,390 330,480" fill="#ffffff" />

    <!-- Blue scrubs inner collar -->
    <polygon points="240,290 260,340 280,290" fill="#0284c7" />

    <!-- Face details -->
    <!-- Eyes -->
    <ellipse cx="230" cy="180" rx="12" ry="7" fill="#1e293b" />
    <ellipse cx="290" cy="180" rx="12" ry="7" fill="#1e293b" />
    <circle cx="232" cy="179" r="4" fill="#ffffff" />
    <circle cx="292" cy="179" r="4" fill="#ffffff" />
    <path d="M216 168 C226 160 238 162 244 168" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M276 168 C282 162 294 160 304 168" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Surgical Protective Mask with Pleats -->
    <g transform="translate(195, 200)">
      <rect x="0" y="0" width="130" height="90" rx="12" fill="url(#maskGrad)" stroke="#38bdf8" stroke-width="2" />
      <line x1="8" y1="25" x2="122" y2="25" stroke="#bae6fd" stroke-width="2" />
      <line x1="8" y1="48" x2="122" y2="48" stroke="#bae6fd" stroke-width="2" />
      <line x1="8" y1="70" x2="122" y2="70" stroke="#bae6fd" stroke-width="2" />
      <!-- Ear loops -->
      <path d="M0 25 C-30 20 -30 65 0 65" fill="none" stroke="#93c5fd" stroke-width="3" />
      <path d="M130 25 C160 20 160 65 130 65" fill="none" stroke="#93c5fd" stroke-width="3" />
    </g>

    <!-- Upraised Arm with Cyan Glove Holding Medical Sample Vial -->
    <g transform="translate(30, 40)">
      <!-- Forearm in lab coat sleeve -->
      <path d="M140 280 L90 120 C85 105 100 95 115 105 L160 250 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
      <!-- Cyan Nitrile Glove Hand -->
      <path d="M85 125 C80 90 110 70 125 100 L120 125 Z" fill="url(#gloveGrad)" />
      <!-- Fingers gripping vial -->
      <rect x="92" y="68" width="18" height="34" rx="9" fill="url(#gloveGrad)" transform="rotate(-15 92 68)" />
      <rect x="106" y="66" width="16" height="34" rx="8" fill="url(#gloveGrad)" transform="rotate(-5 106 66)" />
      <rect x="120" y="70" width="16" height="34" rx="8" fill="url(#gloveGrad)" transform="rotate(10 120 70)" />

      <!-- High Clarity Medical Vaccine / Medicine Vial -->
      <g transform="translate(100, 30)">
        <!-- Rubber Stopper & Blue Cap -->
        <rect x="6" y="0" width="22" height="8" rx="2" fill="#0284c7" />
        <rect x="9" y="8" width="16" height="6" fill="#94a3b8" />
        <!-- Vial Body -->
        <rect x="2" y="14" width="30" height="55" rx="6" fill="#ffffff" opacity="0.85" stroke="#93c5fd" stroke-width="1.5" />
        <!-- Glowing Azure Active Therapeutic Solution -->
        <rect x="4" y="32" width="26" height="35" rx="4" fill="#38bdf8" opacity="0.75" />
        <!-- Medicine Label on Vial -->
        <rect x="5" y="24" width="24" height="20" rx="1" fill="#ffffff" opacity="0.95" />
        <line x1="8" y1="28" x2="26" y2="28" stroke="#0284c7" stroke-width="2" />
        <line x1="8" y1="34" x2="22" y2="34" stroke="#64748b" stroke-width="1" />
        <line x1="8" y1="38" x2="20" y2="38" stroke="#64748b" stroke-width="1" />
      </g>
    </g>
  </g>
</svg>
