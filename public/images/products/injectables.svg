<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff" />
      <stop offset="100%" stop-color="#f3e8ff" />
    </linearGradient>
    <linearGradient id="vialGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#c084fc" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glassShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.16" />
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#purpleBg)" rx="16"/>
  <!-- Tall Vial -->
  <g transform="translate(100, 45)" filter="url(#glassShadow)">
    <rect x="25" y="0" width="30" height="12" rx="3" fill="#cbd5e1"/>
    <rect x="28" y="12" width="24" height="15" rx="1" fill="#7c3aed"/>
    <rect x="33" y="27" width="14" height="10" fill="#cbd5e1"/>
    <rect x="15" y="37" width="50" height="150" rx="10" fill="url(#vialGlass)" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Liquid content -->
    <rect x="17" y="100" width="46" height="85" rx="8" fill="#38bdf8" opacity="0.4"/>
    <!-- Label -->
    <rect x="18" y="70" width="44" height="50" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="22" y="76" width="36" height="6" fill="#0284c7"/>
    <rect x="22" y="86" width="28" height="3" fill="#94a3b8"/>
    <rect x="22" y="93" width="24" height="3" fill="#94a3b8"/>
  </g>
  <!-- Small Vial -->
  <g transform="translate(190, 95)" filter="url(#glassShadow)">
    <rect x="25" y="0" width="30" height="10" rx="3" fill="#cbd5e1"/>
    <rect x="28" y="10" width="24" height="12" rx="1" fill="#0284c7"/>
    <rect x="33" y="22" width="14" height="8" fill="#cbd5e1"/>
    <rect x="15" y="30" width="50" height="100" rx="8" fill="url(#vialGlass)" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="17" y="60" width="46" height="68" rx="6" fill="#c084fc" opacity="0.35"/>
  </g>
  <!-- Syringe laid across -->
  <g transform="translate(150, 190) rotate(15)" filter="url(#glassShadow)">
    <line x1="-70" y1="12" x2="0" y2="12" stroke="#94a3b8" stroke-width="2"/>
    <!-- Barrel -->
    <rect x="0" y="2" width="140" height="20" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" opacity="0.85"/>
    <!-- Liquid inside syringe -->
    <rect x="25" y="5" width="70" height="14" rx="2" fill="#38bdf8" opacity="0.5"/>
    <!-- Plunger -->
    <rect x="95" y="6" width="60" height="12" fill="#0284c7" opacity="0.8"/>
    <rect x="155" y="2" width="6" height="20" rx="2" fill="#0369a1"/>
  </g>
</svg>
