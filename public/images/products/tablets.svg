<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="blisterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="capBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="capWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background foil/card -->
  <rect width="400" height="300" fill="url(#blisterBg)" rx="16"/>
  <!-- Blister foil grid container -->
  <g transform="translate(50, 40) rotate(-5)" filter="url(#shadow)">
    <!-- Foil plate -->
    <rect x="0" y="0" width="300" height="210" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="100" y1="10" x2="100" y2="200" stroke="#cbd5e1" stroke-dasharray="4,4"/>
    <line x1="200" y1="10" x2="200" y2="200" stroke="#cbd5e1" stroke-dasharray="4,4"/>
    <line x1="10" y1="105" x2="290" y2="105" stroke="#cbd5e1" stroke-dasharray="4,4"/>

    <!-- Capsules Row 1 -->
    <g transform="translate(30, 25)">
      <rect x="0" y="0" width="40" height="28" rx="14" fill="url(#capBlue)"/>
      <rect x="0" y="28" width="40" height="28" rx="14" fill="url(#capWhite)"/>
      <line x1="0" y1="28" x2="40" y2="28" stroke="#94a3b8" stroke-width="1"/>
    </g>
    <g transform="translate(130, 25)">
      <rect x="0" y="0" width="40" height="28" rx="14" fill="url(#capBlue)"/>
      <rect x="0" y="28" width="40" height="28" rx="14" fill="url(#capWhite)"/>
      <line x1="0" y1="28" x2="40" y2="28" stroke="#94a3b8" stroke-width="1"/>
    </g>
    <g transform="translate(230, 25)">
      <circle cx="20" cy="28" r="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <line x1="2" y1="28" x2="38" y2="28" stroke="#cbd5e1" stroke-width="2"/>
    </g>

    <!-- Capsules Row 2 -->
    <g transform="translate(30, 125)">
      <circle cx="20" cy="28" r="26" fill="#38bdf8" opacity="0.9"/>
      <text x="20" y="32" font-family="sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">500</text>
    </g>
    <g transform="translate(130, 125)">
      <rect x="0" y="0" width="40" height="28" rx="14" fill="url(#capBlue)"/>
      <rect x="0" y="28" width="40" height="28" rx="14" fill="url(#capWhite)"/>
      <line x1="0" y1="28" x2="40" y2="28" stroke="#94a3b8" stroke-width="1"/>
    </g>
    <g transform="translate(230, 125)">
      <rect x="0" y="0" width="40" height="28" rx="14" fill="url(#capBlue)"/>
      <rect x="0" y="28" width="40" height="28" rx="14" fill="url(#capWhite)"/>
      <line x1="0" y1="28" x2="40" y2="28" stroke="#94a3b8" stroke-width="1"/>
    </g>
  </g>
</svg>
